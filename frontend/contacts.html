<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contacts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="main-nav">
            <div class="nav-left">
                <a href="index.html" class="home-link">🏠 Home</a>
            </div>
            <div class="nav-right">
                <h1>Emergency Contacts</h1>
            </div>
        </nav>
        <div class="content-section">
            <div id="contacts-list"></div>
            <div class="add-bottom">
                <button onclick="showAddContactForm()" class="icon-btn add-action" aria-label="Add Contact">
                    <svg class="add-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span class="btn-label">Add New</span>
                </button>
            </div>
        </div>
        <div id="add-contact-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Add Contact</h2>
                <form id="contact-form">
                    <input type="text" name="name" placeholder="Contact Name" required>
                    <input type="text" name="relation" placeholder="Relation (Caretaker, Relative, Friend, etc.)" required>
                    <input type="text" name="phone" placeholder="Phone Number" required>
                    <textarea name="details" placeholder="Details"></textarea>
                    <button type="submit">Save</button>
                    <button type="button" onclick="closeContactModal()">Cancel</button>
                </form>
            </div>
        </div>
    </div>
    <script src="contacts.js"></script>
</body>
</html>
